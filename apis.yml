aid: prophetic
name: Prophetic
description: >-
  Prophetic is a San Francisco-based neurotechnology startup, incorporated in
  January 2023, building the world's first wearable device for stabilizing lucid
  dreams. Its "Halo" headband pairs EEG sensing with targeted transcranial
  focused ultrasound (tFUS) to noninvasively stimulate the prefrontal cortex,
  driven by an in-house AI model, Morpheus-1, that takes brain activity as its
  prompt and generates shaped ultrasonic waveforms as output. Backed by BoxGroup
  and a16z's Scout Fund, Prophetic sells its neuromodulation headbands
  direct-to-consumer. The company was surfaced as an a16z portfolio company and
  added to the API Evangelist network for enrichment. As of this pass Prophetic
  publishes no public API, developer portal, SDK, or programmatic integration
  surface — it is a consumer hardware and wellness company.
